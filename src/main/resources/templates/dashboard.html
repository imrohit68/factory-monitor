<!DOCTYPE html>
<html lang="en" class="antialiased" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <title>Production Calling System — Dashboard</title>
    <script>
        (function () {
            function reloadIfRestored(e) {
                if (e.persisted) {
                    window.location.reload();
                    return;
                }
                var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
                if (nav && nav.type === 'back_forward') {
                    window.location.reload();
                }
            }
            window.addEventListener('pageshow', reloadIfRestored);
        })();
    </script>
    <script>
        /* Browsers that open via default handler (e.g. Firefox) may not be fullscreen; first tap requests it. */
        (function () {
            var tried = false;
            function tryFullscreen() {
                if (tried || document.fullscreenElement || document.hidden) return;
                var el = document.documentElement;
                if (!el.requestFullscreen) return;
                tried = true;
                var p = el.requestFullscreen();
                if (p && typeof p.then === 'function') {
                    p.catch(function () {
                        tried = false;
                    });
                }
            }
            document.addEventListener('pointerdown', tryFullscreen, { capture: true, passive: true });
        })();
    </script>
    <script th:src="@{/vendor/tailwindcss-standalone.js}"></script>
    <script th:src="@{/vendor/iconify-icon.min.js}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" th:href="@{/css/dashboard-matrix.css}"/>
    <style>
        /* Hide Vue template until mounted — avoids raw {{ }} after bfcache / back without script re-run */
        [v-cloak] { display: none !important; }
    </style>
    <script th:src="@{/vendor/vue.global.prod.js}"></script>
</head>
<body class="bg-[#FFF9F2] text-gray-900 h-screen overflow-hidden flex flex-col">

<!-- Ensures Tailwind JIT sees utilities used only from Vue :class -->
<div aria-hidden="true" class="hidden font-bold border border-gray-200 bg-gray-50 border-2 border-[#E6D82A] bg-[#FFF23E] border-[#4a9e44] bg-[#63BE5B] border-[#3d42b3] bg-[#4A54CF] hover:brightness-[0.97] brightness-[0.97] border-[#FFF23E]/60 border-[#63BE5B]/60 border-[#4A54CF]/60 bg-[#FFF23E]/20 bg-[#63BE5B]/20 bg-[#4A54CF]/20 text-gray-950 group/row group-hover/row:bg-gray-200 z-[60] hover:z-[35] translate-y-1.5 -translate-y-1.5 mb-1.5 mt-1.5 min-w-[7.5rem] max-w-[10.5rem] left-auto right-0 left-0 right-auto"></div>

<div id="app" class="h-screen flex flex-col min-h-0" v-cloak
     th:attr="data-modbus-connected=${modbusConnected},data-modbus-error=${modbusError != null ? modbusError : ''},data-alert-repeat-interval-minutes=${alertRepeatIntervalMinutes},data-alert-max-repeats=${alertMaxRepeats},data-alert-gap-ms=${alertGapMs}">

    <!-- Top bar -->
    <header class="app-nav-bar px-5 sm:px-8 py-5 sm:py-6 flex items-center justify-between shrink-0 relative z-20 gap-5 sm:gap-7">
        <div class="flex items-center gap-5 sm:gap-6 min-w-0">
            <img th:src="@{/images/app-logo.svg}" alt="App Logo" class="w-14 h-14 sm:w-16 sm:h-16 shrink-0"/>
            <div class="flex flex-col justify-center min-w-0 max-w-xl lg:max-w-2xl">
                <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-gray-950 leading-tight">Unicharm India Pvt. Ltd.</h1>
                <div class="text-sm sm:text-base text-gray-500 font-normal mt-1 leading-snug">
                    <th:block th:replace="~{fragments/company-brand :: addressLines}"/>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4 sm:gap-7 shrink-0">
            <div v-if="modbusConnected" class="hidden sm:inline-flex items-center gap-3 px-4 py-2.5 rounded-full bg-emerald-50 border border-emerald-200 shadow-sm">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-base font-bold text-emerald-900 tracking-wide">System Online</span>
            </div>
            <div v-else class="inline-flex flex-wrap items-center gap-2 sm:gap-3 px-3 sm:px-4 py-2 sm:py-2.5 rounded-full bg-amber-50 border border-amber-200 shadow-sm max-w-full">
                <span class="relative flex h-3 w-3 shrink-0 rounded-full bg-amber-500"></span>
                <span class="text-sm sm:text-base font-bold text-amber-950 tracking-wide">Device disconnected</span>
                <a th:href="@{/admin/device-config}" class="text-sm font-semibold text-blue-600 hover:text-blue-800 hover:underline whitespace-nowrap shrink-0">Configure device</a>
            </div>

            <div class="flex items-center gap-3 sm:gap-4">
                <button
                        type="button"
                        class="uc-motion p-3 sm:p-3.5 text-gray-500 hover:text-gray-900 hover:bg-gray-100 rounded-lg border border-transparent hover:border-gray-200 flex items-center justify-center"
                        :title="playingKey != null ? 'Audio playing' : 'Audio idle'">
                    <img v-if="playingKey != null"
                         :src="speakerPlayingSrc"
                         class="speaker-playing-icon w-[6.875rem] h-[6.875rem] sm:w-[7.5rem] sm:h-[7.5rem] shrink-0 object-contain"
                         alt="Audio playing"
                         aria-hidden="true"/>
                    <img v-else
                         th:src="@{/images/speaker-idle.png}"
                         src="/images/speaker-idle.png"
                         class="w-[6.875rem] h-[6.875rem] sm:w-[7.5rem] sm:h-[7.5rem] shrink-0 object-contain"
                         alt="Audio idle"
                         aria-hidden="true"/>
                </button>
                <a th:href="@{/login}" class="uc-motion flex items-center gap-2.5 sm:gap-3 px-5 sm:px-6 py-3 sm:py-3.5 bg-[#111111] text-white rounded-lg hover:bg-black active:scale-[0.98] shadow-sm text-base sm:text-lg font-bold tracking-wide">
                    <iconify-icon icon="solar:login-2-linear" class="text-xl sm:text-2xl" stroke-width="1.5"></iconify-icon>
                    <span class="hidden sm:inline">Login</span>
                </a>
            </div>
        </div>
    </header>

    <p v-if="modbusError" class="shrink-0 px-4 sm:px-6 py-2.5 text-sm font-semibold text-amber-950 bg-amber-50/90 border-b border-amber-100">{{ modbusError }}</p>

    <main class="uc-page-enter flex-1 w-full max-w-[1920px] mx-auto p-4 md:p-6 lg:p-8 flex flex-col gap-6 lg:gap-8 overflow-y-auto min-h-0">

        <div class="shrink-0 flex justify-center px-2 pt-1 pb-2 md:pt-2 md:pb-3 w-full min-w-0 overflow-x-auto">
            <div class="flex flex-col items-center gap-2 text-center">
                <p class="dashboard-project-title text-center font-bold uppercase tracking-[0.12em] leading-tight"
                   aria-label="Production Calling System">
                    Production Calling System
                </p>
                <span class="inline-flex items-center rounded-full border border-gray-200 bg-white px-3 py-1 text-xs font-semibold tracking-[0.08em] text-gray-700 shadow-sm">
                    {{ mode === 'MAINTENANCE' ? 'Maintenance Mode' : 'Production Mode' }}
                </span>
            </div>
        </div>

        <div v-if="workstations.length === 0" class="flex flex-col items-center justify-center py-16 text-center text-gray-500 gap-3">
            <p class="font-medium">No workstations configured.</p>
            <a class="uc-motion text-blue-600 hover:underline font-semibold" th:href="@{/admin/workstations/new}">Add a workstation</a>
        </div>

        <template v-else>
            <div class="flex-1 flex flex-col items-center justify-center w-full min-h-0 py-2 md:py-4">
            <div class="matrix-scroll w-full max-w-[min(100%,1600px)] mx-auto min-w-0 rounded-none md:rounded-sm border-0 shadow-none">
                <table class="matrix-table min-w-[880px]" aria-label="Production line matrix">
                    <thead>
                        <tr>
                            <th class="matrix__corner" scope="col">
                                <div class="matrix__corner-inner">
                                    <span class="matrix__corner-col">Number of machine</span>
                                    <span class="matrix__corner-row">
                                        <span>Professional</span>
                                        <span>Responsible</span>
                                    </span>
                                </div>
                            </th>
                            <th v-for="ws in workstations" :key="'h-' + ws.id" scope="col">{{ ws.name }}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="row in matrixRows" :key="'r-' + row.rowIdx">
                            <th class="matrix__label" scope="row">
                                <div class="matrix__label-inner">
                                    <span
                                            class="matrix__label-text"
                                            :class="{ 'matrix__label-text--stack': row.labelStack }">
                                        <template v-if="row.labelStack">
                                            <span>{{ row.smallLabel }}</span>
                                            <span>{{ row.smallLabelLine2 }}</span>
                                        </template>
                                        <template v-else>{{ row.smallLabel }}</template>
                                    </span>
                                    <span class="matrix__label-letter">{{ row.badgeLetter }}</span>
                                </div>
                            </th>
                            <td
                                    v-for="(ws, colIdx) in workstations"
                                    :key="'d-' + row.rowIdx + '-' + ws.id"
                                    class="matrix-cell group relative hover:z-[35] focus-within:z-[35]"
                                    :class="[
                                        ...cellClasses(ws, row.rowIdx),
                                        { 'cursor-pointer': mode === 'MAINTENANCE' }
                                    ]"
                                    @click="toggleSimulation(slotForRow(ws, row.rowIdx))">
                                <div
                                        class="matrix-cell__hit"
                                        :aria-label="cellAriaLabel(ws, row.rowIdx)"
                                        role="img"
                                        tabindex="-1"></div>
                                <div
                                        v-if="ws && slotForRow(ws, row.rowIdx)"
                                        :class="cellTooltipRootClass(row.rowIdx, colIdx)">
                                    <p class="text-[11px] font-semibold leading-tight text-white">{{ roleDisplayName(slotForRow(ws, row.rowIdx).role) }}</p>
                                    <dl class="mt-1 space-y-0.5 border-t border-gray-800/90 pt-1">
                                        <div class="flex items-center justify-between gap-3 text-[9px] leading-tight">
                                            <dt class="text-gray-500 shrink-0">Bit</dt>
                                            <dd class="tabular-nums font-medium text-gray-200">{{ slotForRow(ws, row.rowIdx).inputBitIndex }}</dd>
                                        </div>
                                        <div class="flex items-center justify-between gap-3 text-[9px] leading-tight">
                                            <dt class="text-gray-500 shrink-0">Slave</dt>
                                            <dd class="tabular-nums font-medium text-gray-200">{{ slotForRow(ws, row.rowIdx).outputSlaveId }}</dd>
                                        </div>
                                        <div class="flex items-center justify-between gap-3 text-[9px] leading-tight">
                                            <dt class="text-gray-500 shrink-0">Relay</dt>
                                            <dd class="tabular-nums font-medium text-gray-200">{{ slotForRow(ws, row.rowIdx).outputChannel }}</dd>
                                        </div>
                                    </dl>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            </div>
        </template>
    </main>
</div>

<script th:src="@{/js/dashboard/dashboard-app.js}"></script>
</body>
</html>
