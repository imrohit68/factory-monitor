<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-include :: head('Admin — Download Event Log')}">
    <title>Download Event Log</title>
</head>
<body class="bg-[#FFF9F2] text-gray-900 h-screen overflow-hidden flex flex-col antialiased font-sans text-base">

<th:block th:replace="~{fragments/admin-include :: pageHeader}"/>

<div class="flex-1 flex min-h-0 max-w-7xl w-full mx-auto px-6 py-4 md:py-6 gap-8">
    <th:block th:replace="~{fragments/admin-include :: sidebar('event-log')}"/>

    <main class="uc-page-enter flex-1 min-w-0 min-h-0 flex flex-col overflow-hidden">
        <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden pr-1 space-y-6">
            <div class="flex items-center gap-4 mb-2 shrink-0">
                <a th:href="@{/admin/workstations}" class="uc-motion p-2 -ml-2 text-gray-400 hover:text-gray-900 hover:bg-gray-100 rounded-lg" title="Back to Workstations">
                    <iconify-icon icon="solar:arrow-left-linear" class="text-2xl"></iconify-icon>
                </a>
                <div>
                    <h2 class="text-2xl font-medium tracking-tight text-gray-900">Download Event Log</h2>
                    <p class="text-base font-normal text-gray-500 mt-1">Export system events as CSV or a table-formatted PDF for the selected date range.</p>
                </div>
            </div>

            <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden max-w-2xl">
                <form id="event-export-form" class="p-6 sm:p-8 space-y-6" action="#" onsubmit="return false;">
                    <div class="bg-blue-50/50 border border-blue-100 rounded-lg p-4 flex items-start gap-3">
                        <iconify-icon icon="solar:info-circle-linear" class="text-xl text-blue-500 shrink-0 mt-0.5"></iconify-icon>
                        <p class="text-sm font-normal text-blue-800">
                            Select a date range to export system events.
                            <span class="font-medium">Maximum allowed range is the latest <span th:text="${maxRangeDays}">30</span> days.</span>
                        </p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="space-y-1.5">
                            <label for="from-date" class="block text-sm font-medium text-gray-700">From Date</label>
                            <input type="date" name="start" id="from-date" required
                                   th:value="${defaultStart}"
                                   class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-base text-gray-900 focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900 uc-motion"/>
                        </div>
                        <div class="space-y-1.5">
                            <label for="to-date" class="block text-sm font-medium text-gray-700">To Date</label>
                            <input type="date" name="end" id="to-date" required
                                   th:value="${defaultEnd}"
                                   class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-base text-gray-900 focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900 uc-motion"/>
                        </div>
                    </div>
                    <div class="pt-2 flex flex-wrap items-center justify-end gap-3 border-t border-gray-100">
                        <button type="button" id="event-export-pdf"
                                class="uc-motion inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-gray-300 bg-white text-base font-normal text-gray-900 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 shadow-sm">
                            <iconify-icon icon="solar:document-text-linear" class="text-xl"></iconify-icon>
                            Download PDF
                        </button>
                        <button type="button" id="event-export-csv"
                                class="uc-motion inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-900 text-base font-normal text-white hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 shadow-sm">
                            <iconify-icon icon="solar:download-linear" class="text-xl"></iconify-icon>
                            Download CSV
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<script>
(function () {
    function parseFilename(cd) {
        if (!cd) return null;
        var star = /filename\*=UTF-8''([^;\s]+)/i.exec(cd);
        if (star) {
            try {
                return decodeURIComponent(star[1].trim());
            } catch (e) {
                return star[1].trim();
            }
        }
        var q = /filename="([^"]+)"/i.exec(cd);
        if (q) return q[1];
        var u = /filename=([^;\s]+)/i.exec(cd);
        if (u) return u[1].replace(/^["']|["']$/g, '');
        return null;
    }
    function triggerBlobDownload(blob, filename) {
        var a = document.createElement('a');
        var url = URL.createObjectURL(blob);
        a.href = url;
        a.download = filename || 'download';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(url);
        a.remove();
    }
    function downloadExport(kind) {
        var form = document.getElementById('event-export-form');
        if (!form) return;
        var startEl = form.querySelector('[name="start"]');
        var endEl = form.querySelector('[name="end"]');
        var start = startEl && startEl.value;
        var end = endEl && endEl.value;
        if (!start || !end) {
            window.alert('Please choose both dates.');
            return;
        }
        var desktop = window.factoryMonitorDesktop;
        if (desktop && typeof desktop.saveEventLogExport === 'function') {
            try {
                desktop.saveEventLogExport(kind, start, end);
            } catch (ex) {
                window.alert(ex && ex.message ? ex.message : 'Download failed.');
            }
            return;
        }
        var path = kind === 'pdf' ? '/report/export.pdf' : '/report/export.csv';
        var url = new URL(path, window.location.origin);
        url.searchParams.set('start', start);
        url.searchParams.set('end', end);
        fetch(url.toString(), { credentials: 'same-origin' })
            .then(function (r) {
                if (!r.ok) {
                    return r.text().then(function (t) {
                        throw new Error(t && t.trim() ? t.trim() : ('HTTP ' + r.status));
                    });
                }
                var fn = parseFilename(r.headers.get('Content-Disposition'));
                if (!fn) {
                    fn = kind === 'pdf' ? 'event-log.pdf' : 'event-log.csv';
                }
                return r.blob().then(function (blob) {
                    triggerBlobDownload(blob, fn);
                });
            })
            .catch(function (err) {
                window.alert(err.message || 'Download failed.');
            });
    }
    function boot() {
        var pdf = document.getElementById('event-export-pdf');
        var csv = document.getElementById('event-export-csv');
        if (pdf) pdf.addEventListener('click', function () { downloadExport('pdf'); });
        if (csv) csv.addEventListener('click', function () { downloadExport('csv'); });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();
</script>
</body>
</html>
