<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-include :: head('Configure device')}">
    <title>Configure device</title>
</head>
<body class="bg-[#FFF9F2] text-gray-900 h-screen overflow-hidden flex flex-col antialiased font-sans text-base">

<th:block th:replace="~{fragments/admin-include :: pageHeader}"/>

<div class="flex-1 flex min-h-0 max-w-7xl w-full mx-auto px-6 py-4 md:py-6 gap-8">
    <th:block th:replace="~{fragments/admin-include :: sidebar('device-config')}"/>

    <main class="uc-page-enter flex-1 min-w-0 min-h-0 flex flex-col overflow-hidden">
        <div class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden pr-1 space-y-6">
            <div class="flex items-center gap-4 mb-2 shrink-0">
                <a th:href="@{/(cb=${T(java.lang.System).currentTimeMillis()})}"
                   class="uc-motion p-2 -ml-2 text-gray-400 hover:text-gray-900 hover:bg-gray-100 rounded-lg" title="Dashboard">
                    <iconify-icon icon="solar:arrow-left-linear" class="text-2xl"></iconify-icon>
                </a>
                <div>
                    <h2 class="text-2xl font-medium tracking-tight text-gray-900">Configure device</h2>
                    <p class="text-base font-normal text-gray-500 mt-1">Serial port for Modbus RTU. Sign in is required (use your admin account).</p>
                </div>
            </div>

            <div th:if="${success}" class="rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900" th:text="${success}"></div>
            <div th:if="${error}" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" th:text="${error}"></div>

            <div class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white px-4 py-3 shadow-sm">
                <th:block th:if="${connected}">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <span class="text-sm font-semibold text-emerald-800">Connected</span>
                </th:block>
                <th:block th:unless="${connected}">
                    <span class="relative flex h-3 w-3 rounded-full bg-amber-500"></span>
                    <span class="text-sm font-semibold text-amber-800">Device disconnected</span>
                </th:block>
                <span class="text-sm text-gray-600">Current port: <strong class="tabular-nums text-gray-900" th:text="${currentPort}">COM1</strong></span>
            </div>

            <div th:if="${lastError != null and not #strings.isEmpty(lastError)}"
                 class="rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-950">
                <span class="font-medium">Last error:</span> <span th:text="${lastError}"></span>
            </div>

            <form th:action="@{/admin/device-config}" method="post"
                  class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden p-6 sm:p-8 space-y-6 max-w-xl">
                <div>
                    <label for="portName" class="block text-base font-normal text-gray-700 mb-2">Serial port</label>
                    <select th:if="${availablePorts != null && !#lists.isEmpty(availablePorts)}"
                            id="portName" name="portName"
                            class="uc-motion w-full max-w-md px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50/50 text-gray-900 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-300">
                        <option th:each="p : ${availablePorts}" th:value="${p}" th:text="${p}"
                                th:selected="${p == currentPort}"></option>
                    </select>
                    <div th:if="${availablePorts == null || #lists.isEmpty(availablePorts)}" class="space-y-2">
                        <p class="text-sm text-amber-700">No ports detected. Enter the port name (e.g. COM3).</p>
                        <input type="text" id="portName" name="portName" th:value="${currentPort}" placeholder="COM3"
                               class="uc-motion w-full max-w-md px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50/50 text-gray-900 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-300"/>
                    </div>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button type="submit"
                            class="uc-motion inline-flex items-center justify-center gap-2 px-5 py-2.5 bg-[#111111] text-white rounded-lg hover:bg-black text-sm font-medium">
                        <iconify-icon icon="solar:diskette-linear" class="text-lg"></iconify-icon>
                        Save &amp; connect
                    </button>
                    <a th:href="@{/admin/device-config(cb=${T(java.lang.System).currentTimeMillis()})}"
                       class="uc-motion inline-flex items-center justify-center gap-2 px-5 py-2.5 border border-gray-200 text-gray-700 rounded-lg hover:bg-gray-50 text-sm font-medium no-underline">
                        Refresh port list
                    </a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
