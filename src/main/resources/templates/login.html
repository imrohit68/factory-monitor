<!DOCTYPE html>
<html lang="en" class="antialiased" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign in — Factory monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#FFF9F2] text-gray-900 min-h-screen flex flex-col">

<div class="flex flex-col min-h-screen">
    <header class="app-nav-bar px-4 sm:px-6 py-4 flex items-center justify-between shrink-0 relative z-20">
        <div class="flex items-center gap-4 sm:gap-5 min-w-0">
            <img th:src="@{/images/app-logo.svg}" alt="App Logo" class="w-11 h-11 sm:w-12 sm:h-12 shrink-0"/>
            <div class="flex flex-col justify-center min-w-0">
                <h1 class="text-lg sm:text-xl font-normal tracking-tight text-gray-900 leading-tight truncate">Unicharm India Pvt. Ltd.</h1>
                <p class="text-xs sm:text-sm text-gray-500 mt-0.5 truncate">Sri City Central Expressway, Sector 24</p>
            </div>
        </div>
        <a th:href="@{/}" class="uc-motion text-sm sm:text-base font-normal text-gray-500 hover:text-gray-900 flex items-center gap-2 shrink-0">
            <iconify-icon icon="solar:monitor-linear" class="text-xl"></iconify-icon>
            <span class="hidden sm:inline">Return to Dashboard</span>
            <span class="sm:hidden">Dashboard</span>
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
        <div class="uc-page-enter w-full max-w-md bg-white rounded-xl md:rounded-2xl border border-gray-200 shadow-sm p-8 sm:p-10">
            <div class="text-center mb-8">
                <div class="flex justify-center mb-5">
                    <img th:src="@{/images/app-logo.svg}" alt="App Logo" class="w-[4.5rem] h-[4.5rem] sm:w-20 sm:h-20 shrink-0" aria-hidden="true"/>
                </div>
                <h2 class="text-xl sm:text-2xl font-normal tracking-tight text-gray-900">Sign in</h2>
                <p class="text-sm text-gray-500 mt-2">Use your credentials to open the admin panel.</p>
                <p th:if="${param.error}" class="text-sm text-red-600 mt-3">Invalid username or password.</p>
            </div>
            <form th:action="@{/login}" method="post" class="space-y-5">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username"
                           class="uc-motion w-full px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50/50 text-gray-900 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-300"/>
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                           class="uc-motion w-full px-3.5 py-2.5 rounded-lg border border-gray-200 bg-gray-50/50 text-gray-900 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900/10 focus:border-gray-300"/>
                </div>
                <button type="submit"
                        class="uc-motion w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-[#111111] text-white rounded-lg hover:bg-black active:scale-[0.99] shadow-sm text-sm font-normal tracking-wide">
                    <iconify-icon icon="solar:login-2-linear" class="text-lg" stroke-width="1.5"></iconify-icon>
                    Login
                </button>
            </form>
        </div>
    </main>
</div>
</body>
</html>
