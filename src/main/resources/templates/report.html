<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Event log export</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<div class="uc-shell">
    <header class="uc-header">
        <th:block th:replace="~{fragments/company-brand :: ucBrand}"/>
        <nav class="uc-nav">
            <a class="btn-outline" th:href="@{/(cb=${#dates.createNow().getTime()})}">Dashboard</a>
        </nav>
    </header>

    <main class="uc-page-enter">
        <div class="report-panel">
            <h2>Download event log</h2>
            <form id="event-export-form" action="#" onsubmit="return false;">
                <div class="report-dates">
                    <label>Date from
                        <input type="date" name="start" required th:value="${defaultStart}"/>
                    </label>
                    <span class="sub" style="align-self:flex-end;padding-bottom:8px;">to</span>
                    <label>Date to
                        <input type="date" name="end" required th:value="${defaultEnd}"/>
                    </label>
                </div>
                <p class="report-warn" th:text="'Only for ' + ${maxRangeDays} + ' days max (inclusive).'">Range limit</p>
                <div class="report-actions">
                    <button class="btn-outline" type="button" id="event-export-pdf">Download PDF</button>
                    <button class="btn-outline" type="button" id="event-export-csv">Download CSV</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="uc-footer">
        <span>Event log export</span>
        <span>Page 2</span>
    </footer>
</div>
<script>
(function () {
    function parseFilename(cd) {
        if (!cd) return null;
        var star = /filename\*=UTF-8''([^;\s]+)/i.exec(cd);
        if (star) {
            try {
                return decodeURIComponent(star[1].trim());
            } catch (e) {
                return star[1].trim();
            }
        }
        var q = /filename="([^"]+)"/i.exec(cd);
        if (q) return q[1];
        var u = /filename=([^;\s]+)/i.exec(cd);
        if (u) return u[1].replace(/^["']|["']$/g, '');
        return null;
    }
    function triggerBlobDownload(blob, filename) {
        var a = document.createElement('a');
        var url = URL.createObjectURL(blob);
        a.href = url;
        a.download = filename || 'download';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        URL.revokeObjectURL(url);
        a.remove();
    }
    function downloadExport(kind) {
        var form = document.getElementById('event-export-form');
        if (!form) return;
        var startEl = form.querySelector('[name="start"]');
        var endEl = form.querySelector('[name="end"]');
        var start = startEl && startEl.value;
        var end = endEl && endEl.value;
        if (!start || !end) {
            window.alert('Please choose both dates.');
            return;
        }
        var desktop = window.factoryMonitorDesktop;
        if (desktop && typeof desktop.saveEventLogExport === 'function') {
            try {
                desktop.saveEventLogExport(kind, start, end);
            } catch (ex) {
                window.alert(ex && ex.message ? ex.message : 'Download failed.');
            }
            return;
        }
        var path = kind === 'pdf' ? '/report/export.pdf' : '/report/export.csv';
        var url = new URL(path, window.location.origin);
        url.searchParams.set('start', start);
        url.searchParams.set('end', end);
        fetch(url.toString(), { credentials: 'same-origin' })
            .then(function (r) {
                if (!r.ok) {
                    return r.text().then(function (t) {
                        throw new Error(t && t.trim() ? t.trim() : ('HTTP ' + r.status));
                    });
                }
                var fn = parseFilename(r.headers.get('Content-Disposition'));
                if (!fn) {
                    fn = kind === 'pdf' ? 'event-log.pdf' : 'event-log.csv';
                }
                return r.blob().then(function (blob) {
                    triggerBlobDownload(blob, fn);
                });
            })
            .catch(function (err) {
                window.alert(err.message || 'Download failed.');
            });
    }
    function boot() {
        var pdf = document.getElementById('event-export-pdf');
        var csv = document.getElementById('event-export-csv');
        if (pdf) pdf.addEventListener('click', function () { downloadExport('pdf'); });
        if (csv) csv.addEventListener('click', function () { downloadExport('csv'); });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
    } else {
        boot();
    }
})();
</script>
</body>
</html>
