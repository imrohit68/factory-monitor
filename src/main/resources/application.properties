# =============================================================================
# Andon — Smart Industrial Andon (Spring Boot)
# Run: ./mvnw spring-boot:run
# UI:  http://localhost:8080/
#
# Input Modbus slave for FC04 reads is fixed in code: ModbusConstants.INPUT_SLAVE_ID (=1).
# Workstations: each has Engineer / Leader / Quality (three relays + input bits) + optional alert audio.
# =============================================================================

spring.application.name=andon-system
server.port=8080

# -----------------------------------------------------------------------------
# Security — form login for /admin/** and /report/** (default in-memory user)
# -----------------------------------------------------------------------------
spring.security.user.name=admin
spring.security.user.password=admin@123

# -----------------------------------------------------------------------------
# Database (JPA / H2)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/andon-db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# Multipart (workstation audio uploads)
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# -----------------------------------------------------------------------------
# Andon
# -----------------------------------------------------------------------------
andon.log-retention-days=30
andon.audio-upload-dir=./data/andon-audio

# When workstation table is empty: seed 16 columns (E/L/Q) = 48 bits → relays 1–48 (slave 2 then 3).
andon.seed-default-workstations=true
andon.default-relay-slave-first=2
andon.default-relay-slave-second=3

# -----------------------------------------------------------------------------
# Modbus RTU (j2mod + USB-RS485)
# -----------------------------------------------------------------------------
andon.modbus.port-name=cu.usbserial-B002EZIO
andon.modbus.baud-rate=9600
andon.modbus.data-bits=8
andon.modbus.stop-bits=1
andon.modbus.parity=None
andon.modbus.encoding=rtu
andon.modbus.input-register-start=0
# Increase if you use input bits above (count * 16 - 1).
andon.modbus.input-register-count=4
andon.modbus.poll-interval-ms=5000
andon.modbus.log-each-read=true
andon.modbus.coil-start-address=0
