# =============================================================================
# Production Calling System (Spring Boot) — workstation dashboard, Modbus, event log
# Run: ./mvnw spring-boot:run
# UI:  http://localhost:8080/
#
# Modbus: see system.modbus.*. Default workstations: src/main/resources/data.sql (runs after schema init).
# Workstations: each has Engineer / Leader / Quality Controller (three relays + input bits) + optional alert audio.
# =============================================================================

spring.application.name=production-calling-system
server.port=8080
# Bind all interfaces so phones/PCs on the LAN can open http://<this-machine-ip>:8080/ (same JVM playback sync).
server.address=0.0.0.0

# Suppress the Spring Boot startup banner in production
spring.main.banner-mode=off

# Log to a file inside the data directory (rotation/retention: Spring Boot Logback defaults unless you set
# logging.logback.rollingpolicy.* — not the same as system.log-retention-days below).
logging.file.name=${system.data-dir}/logs/production-calling-system.log
# When true, runs the UI inside a JavaFX WebView instead of the system browser.
# OGG/WAV alert uploads are stored as MP3 (requires FFmpeg on PATH or system.audio-ffmpeg-path). Legacy GETs to *.ogg/*.wav redirect to *.mp3.
system.desktop-mode=true
# Default mode for non-desktop/headless runs. Desktop mode lets the operator choose at startup.
system.operation-mode=PRODUCTION
# Used only when system.desktop-mode=true: exclusive fullscreen vs normal window.
system.desktop-fullscreen=true
# When system.desktop-mode=true: if false, the window close (X) does not exit the app; a dialog explains Admin → Shut down application. F11 toggles fullscreen after Esc.
system.desktop-allow-window-close=true
# Open http://127.0.0.1:{port}/ when the server is ready (ignored when system.desktop-mode=true).
system.launch-browser=true
# Optional override; default is server.port + 10000 (loopback only). Second launch uses this when desktop-mode is true.
# system.desktop-activation-port=18080
# Only one JVM per data directory; a second launch opens the dashboard in the browser and exits immediately.
system.single-instance=true
# Stop the app from Admin → Shut down application (or kill the process). Closing the browser tab does not exit the JVM.

# -----------------------------------------------------------------------------
# Security — form login for /admin/** and /report/**; users stored in SQLite (app_user).
# Restore the DB to restore logins. Initial user is created only when app_user is empty
# (first install); set system.security.initial-* for that one-time bootstrap password.
# -----------------------------------------------------------------------------
system.security.initial-username=admin
system.security.initial-password=admin@123

# -----------------------------------------------------------------------------
# Persisted data (SQLite + alert audio) — all under system.data-dir (outside the app tree by default).
# Back up the whole folder to recover DB and uploaded sounds together. Optional system.audio-upload-dir
# defaults to ${system.data-dir}/alert-audio if unset (see AppProperties).
# -----------------------------------------------------------------------------
system.data-dir=${user.home}/production-calling-system-data
spring.datasource.url=jdbc:sqlite:${system.data-dir}/production-calling-system.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
# Run data.sql after JPA creates/updates schema (see resources/data.sql).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# Multipart (workstation audio uploads)
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# -----------------------------------------------------------------------------
# Application
# -----------------------------------------------------------------------------
# Max inclusive calendar-day span for admin event log CSV/PDF export (does not delete data or log files).
system.log-retention-days=30
# SQLite event_log: automatically delete rows with event_time older than this many days (0 = disable). Daily at 03:00.
system.event-log-purge-retention-days=30
# Same tree as DB — omit to use default ${system.data-dir}/alert-audio
system.audio-upload-dir=${system.data-dir}/alert-audio
# Ephemeral MP3 previews for workstation form (WAV/OGG before save). Default: ${system.data-dir}/alert-audio-preview
# system.audio-preview-dir=
system.audio-preview-retention-hours=24
# FFmpeg for OGG → MP3 (alert uploads and legacy .ogg URLs). If unset, probes PATH then common paths
# (e.g. /opt/homebrew/bin/ffmpeg on Apple Silicon). IDEs often have a minimal PATH — set this if needed.
# system.audio-ffmpeg-path=

# Dashboard alert audio: after each play ends, repeat at most alert-max-repeats times, spaced by
# alert-repeat-interval-minutes (while the line input stays active).
system.dashboard-alert-repeat-interval-minutes=1
system.dashboard-alert-max-repeats=2

# -----------------------------------------------------------------------------
# Modbus RTU (j2mod + USB-RS485)
# -----------------------------------------------------------------------------
# DI module unit ID for FC04 input register reads.
system.modbus.input-slave-id=1
# Relays per output board (e.g. Waveshare 32CH); validates relay numbers on FC05.
system.modbus.relay-channels-per-slave=32

system.modbus.port-name=cu.usbserial-B002EZIO
system.modbus.baud-rate=9600
system.modbus.data-bits=8
system.modbus.stop-bits=1
system.modbus.parity=None
system.modbus.encoding=rtu
system.modbus.input-register-start=0
# Increase if you use input bits above (count * 16 - 1).
system.modbus.input-register-count=4
system.modbus.poll-interval-ms=1000
system.modbus.log-each-read=false
system.modbus.coil-start-address=0
