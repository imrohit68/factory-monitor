spring.main.banner-mode=off
system.desktop-mode=false
system.launch-browser=false
system.single-instance=false
system.exit-on-browser-close=false
system.event-log-purge-retention-days=0
# Login: JPA users + AdminUserSeedRunner (same defaults as main)
# In-memory SQLite for tests (no file under system.data-dir)
spring.datasource.url=jdbc:sqlite::memory:
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
system.data-dir=${java.io.tmpdir}/production-calling-system-test-data
system.audio-upload-dir=${system.data-dir}/alert-audio
